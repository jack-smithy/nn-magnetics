[project]
name = "nn-magnetics"
version = "0.1.2"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jack Smith", email = "jacksmith2000@me.com" }
]
requires-python = ">=3.12"
dependencies = [
    "magpylib-material-response>=0.3.0",
    "numpy>=2.1.3",
    "magpylib>=5.1.0",
    "torch>=2.5.1",
    "tqdm>=4.67.0",
    "wandb>=0.18.6",
    "nbformat>=5.10.4",
    "scipy>=1.14.1",
    "wakepy>=0.10.1",
    "jaxtyping>=0.2.36",
    "equinox>=0.11.9",
    "einops>=0.8.0",
    "scikit-learn>=1.6.1",
    "pandas>=2.2.3",
    "torch-geometric>=2.6.1",
    "bayesian-optimization>=2.0.3",
    "pytorch-minimize>=0.0.2",
    "pyvista>=0.45.2",
    "stl>=0.0.3",
    "numpy-stl>=3.2.0",
    "cmasher>=1.9.2",
    "pypdf2>=3.0.1",
    "pdf2image>=1.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nn_magnetics"]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "mypy>=1.13.0"
]

[tool.ruff.lint]
ignore=["F722", "F541"]
